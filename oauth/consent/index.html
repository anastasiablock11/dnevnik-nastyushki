<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Подключение ChatGPT — Дневник Настюшки</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #4d3940;
      background:
        radial-gradient(circle at 20% 0%, #f4dce7, transparent 38%),
        #fff8fb;
    }

    .card {
      width: min(540px, 100%);
      padding: 28px;
      background: #ffffff;
      border: 1px solid #eadde3;
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(103, 66, 84, .13);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      line-height: 1.55;
    }

    .muted {
      color: #836f76;
    }

    .box {
      margin: 18px 0;
      padding: 16px;
      border-radius: 16px;
      background: #fdf1f6;
    }

    .hidden {
      display: none;
    }

    label {
      display: grid;
      gap: 6px;
      margin-top: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d9c7cf;
      border-radius: 12px;
      font: inherit;
      color: #4d3940;
      background: white;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 17px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .primary {
      color: white;
      background: #a95f7d;
    }

    .secondary {
      color: #4d3940;
      background: #eee1dc;
    }

    .error {
      color: #b55266;
    }

    .success {
      color: #5f9277;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>🌸 Дневник Настюшки</h1>

    <p class="muted">
      ChatGPT хочет подключиться к твоему дневнику.
    </p>

    <div id="status" class="box">
      Проверяю запрос…
    </div>


    <form id="loginForm" class="hidden">

      <p>
        <strong>Сначала войди в свой аккаунт дневника.</strong>
      </p>

      <label>
        Электронная почта

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >
      </label>

      <label>
        Пароль

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          required
        >
      </label>

      <div class="actions">
        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          Войти
        </button>
      </div>

      <p id="loginError" class="error"></p>

    </form>


    <section id="consent" class="hidden">

      <div class="box">

        <div>
          <strong>Приложение:</strong>
          ChatGPT
        </div>

        <br>

        <div>
          <strong>Аккаунт:</strong>
          <span id="accountEmail"></span>
        </div>

      </div>

      <p>
        Разрешить ChatGPT подключиться к данным
        «Дневника Настюшки»?
      </p>

      <div class="actions">

        <button
          id="approveButton"
          class="primary"
          type="button"
        >
          Разрешить
        </button>

        <button
          id="denyButton"
          class="secondary"
          type="button"
        >
          Отказать
        </button>

      </div>

      <p id="decisionError" class="error"></p>

    </section>

  </main>


  <script>
    (() => {

      "use strict";


      const SUPABASE_URL =
        "https://akikxtukzvxojyxhtizx.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_1Zoj_1Vts2-ZqnFh1S3-hQ_-RqoSPrU";


      const cloud =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );


      const status =
        document.getElementById("status");

      const loginForm =
        document.getElementById("loginForm");

      const consent =
        document.getElementById("consent");

      const loginError =
        document.getElementById("loginError");

      const decisionError =
        document.getElementById("decisionError");


      const authorizationId =
        new URLSearchParams(
          window.location.search
        ).get("authorization_id");


      if (!authorizationId) {

        status.innerHTML =
          '<span class="error">' +
          'Нет authorization_id. ' +
          'Вернись в ChatGPT и запусти подключение снова.' +
          '</span>';

        return;
      }


      async function loadAuthorization() {

        loginForm.classList.add("hidden");
        consent.classList.add("hidden");

        status.textContent =
          "Проверяю вход в дневник…";


        const {
          data: { user }
        } =
          await cloud.auth.getUser();


        if (!user) {

          status.textContent =
            "Нужно войти в аккаунт дневника.";

          loginForm.classList.remove("hidden");

          return;
        }


        status.textContent =
          "Проверяю запрос ChatGPT…";


        const {
          data,
          error
        } =
          await cloud.auth.oauth
            .getAuthorizationDetails(
              authorizationId
            );


        if (error) {

          status.innerHTML =
            '<span class="error">' +
            error.message +
            '</span>';

          return;
        }


        if (
          data &&
          !("authorization_id" in data) &&
          data.redirect_url
        ) {

          window.location.assign(
            data.redirect_url
          );

          return;
        }


        document.getElementById(
          "accountEmail"
        ).textContent =
          data?.user?.email ||
          user.email ||
          "";


        status.innerHTML =
          '<span class="success">' +
          'Запрос готов к подтверждению.' +
          '</span>';


        consent.classList.remove(
          "hidden"
        );
      }


      loginForm.addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          loginError.textContent = "";


          const email =
            document.getElementById(
              "email"
            ).value.trim();


          const password =
            document.getElementById(
              "password"
            ).value;


          const button =
            document.getElementById(
              "loginButton"
            );


          button.disabled = true;
          button.textContent =
            "Вхожу…";


          const {
            error
          } =
            await cloud.auth
              .signInWithPassword({
                email,
                password
              });


          if (error) {

            loginError.textContent =
              error.message;

            button.disabled = false;
            button.textContent =
              "Войти";

            return;
          }


          button.disabled = false;
          button.textContent =
            "Войти";


          await loadAuthorization();
        }
      );


      async function makeDecision(
        approve
      ) {

        decisionError.textContent = "";


        const approveButton =
          document.getElementById(
            "approveButton"
          );

        const denyButton =
          document.getElementById(
            "denyButton"
          );


        approveButton.disabled = true;
        denyButton.disabled = true;


        const result =
          approve

            ? await cloud.auth.oauth
                .approveAuthorization(
                  authorizationId,
                  {
                    skipBrowserRedirect: true
                  }
                )

            : await cloud.auth.oauth
                .denyAuthorization(
                  authorizationId,
                  {
                    skipBrowserRedirect: true
                  }
                );


        if (result.error) {

          decisionError.textContent =
            result.error.message;

          approveButton.disabled = false;
          denyButton.disabled = false;

          return;
        }


        if (!result.data?.redirect_url) {

          decisionError.textContent =
            "Supabase не вернул адрес возврата.";

          approveButton.disabled = false;
          denyButton.disabled = false;

          return;
        }


        window.location.assign(
          result.data.redirect_url
        );
      }


      document.getElementById(
        "approveButton"
      ).addEventListener(
        "click",
        () => makeDecision(true)
      );


      document.getElementById(
        "denyButton"
      ).addEventListener(
        "click",
        () => makeDecision(false)
      );


      loadAuthorization();

    })();
  </script>

</body>
</html>
